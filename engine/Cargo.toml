[workspace]
resolver = "2"
members = [
    "crates/rendrix-css",
    "crates/rendrix-dom",
    "crates/rendrix-layout",
    "crates/rendrix-gfx",
    "crates/rendrix-core",
    "crates/rendrix-js",
    "crates/rendrix-runtime",
    "crates/rendrix-web",
]

[workspace.package]
version = "0.5.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
criterion = "0.5"
taffy = { version = "0.9", default-features = false, features = ["std", "flexbox", "grid", "block_layout", "content_size", "taffy_tree"] }
cosmic-text = "0.14"
wgpu = "25"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
rquickjs = { version = "=0.14.0", features = ["loader", "futures"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
glam = "0.34"

rendrix-css = { path = "crates/rendrix-css" }
rendrix-dom = { path = "crates/rendrix-dom" }
rendrix-layout = { path = "crates/rendrix-layout" }
rendrix-gfx = { path = "crates/rendrix-gfx" }
rendrix-core = { path = "crates/rendrix-core" }
rendrix-js = { path = "crates/rendrix-js" }

[profile.release]
# Size-focused release profile. Rationale for each knob in docs/PERF_BINARY_SIZE.md.
# Full (fat) LTO instead of thin: lets the linker inline and eliminate dead code across
# *all* crates, which is the biggest safe size win. Cost: a much slower link step.
lto = "fat"
# One codegen unit per crate: gives LTO/the optimizer whole-crate visibility, improving
# dead-code elimination and inlining. Cost: less build parallelism, longer compile.
codegen-units = 1
# Keep speed optimizations. Lowering to "s"/"z" would shrink further but slows the
# renderer; size is being won via LTO + stripping instead. A separate size profile is
# an option if measurements justify it.
opt-level = 3
# Strip the symbol table from the final executable (largest low-risk win on Windows,
# where release builds normally carry no DWARF debug info for "debuginfo" to remove).
# Trade-off: stripped release binaries give poorer stack traces and are harder to
# profile; archive an unstripped build if you need to debug a shipped crash.
strip = "symbols"
# NOTE: panic = "abort" is deliberately NOT enabled. It would remove unwinding tables
# for extra size, but it changes runtime semantics (destructors/catch_unwind are gone,
# the rendrix-web panic hook can no longer be followed by recovery, and third-party
# crates that unwind across FFI boundaries would abort). It also changes `--release`
# benchmark behaviour. Tests are unaffected either way, but the size/behavior
# trade-off needs a real measurement before enabling — see docs/PERF_BINARY_SIZE.md.

[profile.dev]
opt-level = 1
