[package]
name = "rendrix-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rendrix application runtime: window, input, frame loop and bundle loader"

[lib]
doctest = false
name = "rendrix_runtime"

[[bin]]
name = "rendrix-runtime"
path = "src/main.rs"

[dependencies]
rendrix-core.workspace = true
rendrix-dom.workspace = true
rendrix-css.workspace = true
rendrix-gfx.workspace = true
rendrix-js.workspace = true
wgpu.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
accesskit = "0.25"
web-time = "1"

# Native shells (desktop + Android/iOS) use winit; the web target is driven by `rendrix-web`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit.workspace = true
pollster.workspace = true
accesskit_winit = "0.34"

# Desktop only: system clipboard and gamepads have no backend on Android/iOS (the shell
# supplies a memory clipboard; gamepads arrive through the platform driver).
[target.'cfg(not(any(target_os = "android", target_os = "ios", target_arch = "wasm32")))'.dependencies]
arboard = { version = "3", default-features = false }
gilrs = "0.11"

[dev-dependencies]
criterion.workspace = true
tungstenite = "0.30"

[[bench]]
name = "pipeline"
harness = false
