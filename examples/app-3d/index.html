<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rendrix 3D Cube</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="src/main.ts"></script>
  </head>
  <body>
    <main class="shell">
      <section class="card">
        <div class="badge">RENDRIX · SOFTWARE 3D</div>
        <h1>Spinning cube</h1>
        <p class="subtitle">A <code>RendrixScene</code> on a <code>&lt;canvas&gt;</code>, repainted every animation frame.</p>
        <canvas id="scene" width="480" height="320"></canvas>
        <p class="status" id="status">starting…</p>
        <div class="badge">RENDRIX · GPU 3D</div>
        <p class="subtitle">The same API on a <code>&lt;canvas data-3d&gt;</code>: multi-light, alpha, culling.</p>
        <canvas id="scene-gpu" data-3d width="480" height="320"></canvas>
      </section>
    </main>
  </body>
</html>
